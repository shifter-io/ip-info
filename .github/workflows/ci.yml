# Merge checks (README.md, Development) on every ready pull request, every
# push to main and owner dispatches.
#
# Every job runs on a fresh one-job CI-SelfHosted runner: `ci-2cpu` for
# the change filter and the generated-file checks, `ci-4cpu` for the Rust
# checks and the browser tests. Each server runs one job and is destroyed
# after it, so nothing persists between runs: compiled crates come from
# sccache, and the Playwright browser and the Markdown virtualenv from what
# the nightly image build installed under $CI_CACHE_DIR/ip-info with
# .github/ciod/prefetch.sh (installed now when the image lacks them). Builds
# use the checkout's target/: a CARGO_* variable naming a per-server folder
# would enter every sccache key and so never hit. A job-started
# hook on the servers refuses every job except the owner's own pull requests
# from branches of this repository, pushes to main, schedules and owner
# dispatches.
#
# A pull request that changes only README.md, LICENSE or docs/ runs only the
# `artifacts` job. Draft pull requests run nothing until marked ready.
#
# `gate` is the one check to require. It starts with the other jobs, waits for
# them by reading this run (.github/ci/gate.py) and passes only when `changes`
# and `artifacts` succeeded and `rust` succeeded or was skipped for a
# docs-only pull request. On a draft it is skipped under another name, so a
# draft run leaves no `gate` result on the commit, neither a pass nor a
# failure that would outlive the ready run.
#
# Each push to main has its own concurrency group, so a later merge never
# cancels or replaces an earlier commit's run; pull requests share one group
# per branch and cancel their superseded runs.
#
# Not here: the checks that need the licensed MMDB, which CI never fetches:
# the ignored database tests (`cargo test --locked -- --ignored`), the browser
# tests tagged @db and scripts/smoke.py.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Line tables keep file and line in backtraces without full debuginfo.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# timeout-minutes keeps the margin it had for the old pool's job-started hook
# until the CI-SelfHosted reports show the jobs' times there.
jobs:
  changes:
    name: changes
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: [self-hosted, ci-2cpu]
    timeout-minutes: 15
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        run: bash .github/ci/changes.sh | tee -a "$GITHUB_OUTPUT"

  # Generated files, the toolchain pin and the offline artifact checks. Every
  # ready pull request runs this job, a docs-only one nothing else.
  artifacts:
    name: artifacts
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: [self-hosted, ci-2cpu]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The Docker build uses the pinned Rust release
        run: |
          channel=$(sed -n 's/^channel = "\([0-9.]*\)"$/\1/p' rust-toolchain.toml)
          minor=${channel%.*}
          echo "rust-toolchain.toml: ${channel:-missing}; $(grep -m1 '^FROM rust:' Dockerfile)"
          # The image may name the release (rust:1.94.1-...) or its line (rust:1.94-...).
          if [ -z "$channel" ] || ! grep -qE "^FROM rust:(${channel//./\\.}|${minor//./\\.})-" Dockerfile; then
            echo "::error::the Dockerfile's Rust image must use rust-toolchain.toml's release"
            exit 1
          fi
      # scripts/generate_site.py formats the Rust it writes with rustfmt.
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Markdown for scripts/render_readme.py
        run: |
          : "${CI_CACHE_DIR:?is not set; this job needs the self-hosted CI runners}"
          bash .github/ciod/prefetch.sh markdown
          . .github/ci/pins.env
          echo "MARKDOWN_PYTHON=$CI_CACHE_DIR/ip-info/tools/markdown-$MARKDOWN_VERSION/bin/python" >> "$GITHUB_ENV"
      - name: Generated files are fresh
        run: |
          python3 --version
          python3 scripts/generate_site.py
          "$MARKDOWN_PYTHON" scripts/render_readme.py
          git status --short
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::regenerate with scripts/generate_site.py and scripts/render_readme.py and commit the result"
            exit 1
          fi
      - run: python3 scripts/validate_artifacts.py

  # The Rust checks, then the browser tests against the binary the tests built.
  rust:
    name: rust
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: [self-hosted, ci-4cpu]
    timeout-minutes: 30
    env:
      NODE_VERSION: 24.21.0
      npm_config_audit: 'false'
      npm_config_fund: 'false'
      npm_config_update_notifier: 'false'
    steps:
      - name: The changes job must have succeeded
        if: needs.changes.result != 'success'
        env:
          RESULT: ${{ needs.changes.result }}
        run: echo "::error::changes job $RESULT" && exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the runner's cache
        run: |
          : "${CI_CACHE_DIR:?is not set; this job needs the self-hosted CI runners}"
          cache="$CI_CACHE_DIR/ip-info"
          {
            echo "npm_config_cache=$cache/npm"
            echo "PLAYWRIGHT_BROWSERS_PATH=$cache/tools/ms-playwright"
          } >> "$GITHUB_ENV"
          df -h "$CI_CACHE_DIR"
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Also builds the server binary the browser tests start.
      - run: cargo test --locked
      - name: Node from the runner
        run: |
          echo "node $(node --version), npm $(npm --version)"
          [ "$(node --version)" = "v$NODE_VERSION" ] || { echo "::error::expected node v$NODE_VERSION"; exit 1; }
      - run: npm ci
      - name: Playwright's headless shell
        run: bash .github/ciod/prefetch.sh playwright
      # A free port and TEST_BASE_URL: Playwright's own web server would bind
      # 8080 and reuse any server already listening there.
      - name: Browser tests without the database
        run: |
          cargo build --locked
          port=$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')
          BIND_ADDR="127.0.0.1:$port" target/debug/ip-info > "$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2> /dev/null || true; cat "$RUNNER_TEMP/server.log"' EXIT
          for _ in $(seq 60); do
            curl -fsS "http://127.0.0.1:$port/healthz" > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS "http://127.0.0.1:$port/healthz" > /dev/null
          TEST_BASE_URL="http://127.0.0.1:$port" npm run test:browser -- --grep-invert @db

  # The required check (header). No `needs`: it starts at once and polls.
  gate:
    name: ${{ github.event.pull_request.draft && 'gate (skipped on drafts)' || 'gate' }}
    if: ${{ !github.event.pull_request.draft }}
    runs-on: [self-hosted, ci-2cpu]
    # rust's 30 and changes' 15 minutes, plus their boots.
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        run: bash .github/ci/changes.sh | tee -a "$GITHUB_OUTPUT"
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          CODE: ${{ steps.diff.outputs.code }}
        run: python3 -u .github/ci/gate.py
