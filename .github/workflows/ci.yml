# Merge checks (README.md, Development): one job, `tier1`, the one check to
# require. It runs on ready pull requests, on merge-queue groups, every 6 hours
# on main (slow tests included) and on owner dispatches. A push to main runs
# nothing: the merge queue tested the merged result before it landed.
#
# One fresh CI-SelfHosted server per run (`ci-8cpu`; a dispatch may pick
# `ci-2cpu`, `ci-4cpu`, `ci-16cpu` or `ci-32cpu` with `size`) runs every
# check at the same time as a part of .github/ci/parts.sh: fmt, clippy,
# generated, ci-scripts, npm, build, rust-tests, browser and coverage. The
# server is destroyed after the job, so nothing persists between runs:
# compiled crates come from sccache, and the
# Playwright browser, the Markdown and diff-cover virtualenvs and
# cargo-llvm-cov from what the nightly image build installed under
# $CI_CACHE_DIR/ip-info with .github/ciod/prefetch.sh (installed now when the
# image lacks them). Builds use the checkout's target/:
# a CARGO_TARGET_DIR naming a per-server folder would enter every sccache key
# and so never hit. A job-started hook on the servers refuses every job except
# the owner's own pull requests from branches of this repository, merge-queue
# groups, schedules and owner dispatches.
#
# `ci-8cpu` is the default by measurement (#17): on 3 runs with a warm sccache
# its parts step averaged 33 s and its job 56 s, inside the 90 s and 240 s
# targets. `ci-16cpu` and `ci-32cpu` were 5 and 12 s faster at 2 and 4 times
# the cost. `ci-2cpu` and `ci-4cpu` (#32) also met both targets (parts step
# 71 and 45 s, job 96 and 70 s) at 40% and 77% of the cost, but their servers
# boot about 40 and 55 s slower, so feedback (server wait plus job) averaged
# 222 and 213 s against 122 s on `ci-8cpu`: more than the 30 s allowed.
#
# build makes one instrumented binary set (cargo-llvm-cov) that serves the
# Rust tests, the doc tests and the browser tests' server. coverage then
# writes the lcov report, adds the per-file line table to the job summary
# and, on pull requests only, fails when under 85% of
# the Rust lines the request changes are covered (diff-cover against HEAD^1,
# main); diff-cover's report goes to the job summary too. Merge-queue, scheduled
# and dispatched runs build the report without the rule: no single diff.
#
# On pull requests, tests marked slow are skipped: Rust tests named slow_*
# and Playwright tests tagged @slow. Every other event runs them. The Timing
# step (.github/ci/timing.py) adds each part's time and the 10 slowest tests
# to the job summary, and fails the job when a test not marked slow took over
# 60 s on a pull request, any test took 90 s or more, or the parts step took
# over 240 s (its target is 90 s).
#
# A pull request that changes only README.md, LICENSE or docs/
# (.github/ci/changes.sh) runs only the generated and ci-scripts parts, and
# still reports `tier1`. A draft runs nothing: its job is named
# `tier1 (skipped on drafts)`, so it leaves no `tier1` result on the commit;
# marking it ready runs `tier1`.
#
# A pull request keeps one run per branch and cancels the one it replaces;
# merge-queue, scheduled and dispatched runs never cancel each other. A red
# scheduled run opens one issue (.github/ci/report-red.sh).
#
# The Rust database tests, every browser test and scripts/smoke.py run on the
# test database (tests/fixtures/*.mmdb, scripts/build_test_mmdb.py).
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "0 */6 * * *"   # full run on main, slow tests included
  workflow_dispatch:
    inputs:
      size:
        description: CI server size
        type: choice
        options: [ci-2cpu, ci-4cpu, ci-8cpu, ci-16cpu, ci-32cpu]
        default: ci-8cpu

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Line tables keep file and line in backtraces without full debuginfo.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  NODE_VERSION: 24.21.0
  npm_config_audit: 'false'
  npm_config_fund: 'false'
  npm_config_update_notifier: 'false'

jobs:
  tier1:
    name: ${{ github.event.pull_request.draft && 'tier1 (skipped on drafts)' || 'tier1' }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: [self-hosted, "${{ inputs.size || 'ci-8cpu' }}"]
    timeout-minutes: 15
    steps:
      # For a pull request: the request merged into main, so HEAD^1 is main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Changed files
        run: |
          bash .github/ci/changes.sh | tee -a "$GITHUB_ENV"
      - name: Tools
        run: |
          : "${CI_CACHE_DIR:?is not set; this job needs the self-hosted CI runners}"
          cache="$CI_CACHE_DIR/ip-info"
          . .github/ci/pins.env
          {
            echo "npm_config_cache=$cache/npm"
            echo "PLAYWRIGHT_BROWSERS_PATH=$cache/tools/ms-playwright"
            echo "MARKDOWN_PYTHON=$cache/tools/markdown-$MARKDOWN_VERSION/bin/python"
            echo "DIFF_COVER=$cache/tools/diff-cover-$DIFF_COVER_VERSION/bin/diff-cover"
          } >> "$GITHUB_ENV"
          echo "$cache/tools/cargo-llvm-cov-$CARGO_LLVM_COV_VERSION" >> "$GITHUB_PATH"
          df -h "$CI_CACHE_DIR"
          rustup show active-toolchain || rustup toolchain install
          # Images built before rust-toolchain.toml listed llvm-tools lack it.
          [[ "$(rustup component list --installed)" == *llvm-tools* ]] || rustup component add llvm-tools-preview
          echo "node $(node --version), npm $(npm --version)"
          [ "$(node --version)" = "v$NODE_VERSION" ] || { echo "::error::expected node v$NODE_VERSION"; exit 1; }
          bash .github/ciod/prefetch.sh markdown cargo-llvm-cov diff-cover
      - name: Parts
        id: parts
        run: bash .github/ci/parts.sh
      # After a red Parts step too, so every run that reached it gets the
      # report; a green Timing step never turns a red job green.
      - name: Timing
        if: always() && steps.parts.outcome != 'skipped'
        run: >-
          python3 .github/ci/timing.py --event "$GITHUB_EVENT_NAME" --code "$code"
          --parts "$RUNNER_TEMP/parts" --start "$RUNNER_TEMP/parts/parts.start"
          --junit target/nextest/ci/junit.xml --playwright artifacts/browser-results.json
      - name: Browser results and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tier1-logs
          path: |
            artifacts/browser
            ${{ runner.temp }}/server.log
            ${{ runner.temp }}/parts
          if-no-files-found: ignore
          retention-days: 14

  # Scheduled runs only: a dispatched run's result is read by whoever started it.
  report:
    needs: tier1
    if: always() && github.event_name == 'schedule' && needs.tier1.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/ci
      - name: Open an issue unless one is open
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/ci/report-red.sh "Scheduled full CI run failed on main"
