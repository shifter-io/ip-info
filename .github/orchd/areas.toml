# Work areas of ip-info for orchd: one open task per area (GLOBAL 3.1). ip-info keeps no area table,
# so this map is derived from the tree and from its generators, and is effectively one lane for code.
# Generators checked: scripts/generate_site.py reads site/ (the proxy page and its flags included),
# api_contract.py, examples.py, proxy_page.py and text_checks.py, and writes web/, src/response.rs,
# tests/example.json, tests/lite-example.json and docs/operations.html; CI's `artifacts` step
# "Generated files are fresh" reruns it with scripts/render_readme.py (README.md to
# docs/readme.html) and fails on any difference. So the site, the proxy page, the flags, the Rust
# server and the generated files are one area, `app`. Not CI-checked but kept inside one area too:
# generate_meta_images.py (web/meta, docs/meta-images.html) in `app`; render_validation.py and
# render_stress_report.py (docs/validation.html, docs/stress-test.html) in `bench`. The globs are
# pairwise disjoint and cover every tracked file. A path that matches no glob counts as area:shared,
# which conflicts with every area.
v = 1

[areas]
# the site generator, its inputs and every file it writes: the Rust lookup server and its API tests
# and fixtures, the page sources (the web-proxy page and its flags included), the generated web/
# output, the API contract and examples, the copy and artifact checks, the meta-image and favicon
# generators, the browser tests, the stress example and the MMDB source manifest
app = [
    "src/**",
    "tests/api.rs",
    "tests/example.json",
    "tests/lite-example.json",
    "tests/browser/**",
    "examples/**",
    "data/**",
    "site/**",
    "web/**",
    "scripts/generate_site.py",
    "scripts/api_contract.py",
    "scripts/examples.py",
    "scripts/proxy_page.py",
    "scripts/text_checks.py",
    "scripts/validate_artifacts.py",
    "scripts/generate_meta_images.py",
    "scripts/generate_favicons.js",
    "docs/operations.html",
    "docs/meta-images.html",
    "docs/meta-images-preview.jpg",
]
# the browser-test toolchain: Playwright settings and the npm manifest and lockfile
browser = ["playwright.config.js", "package.json", "package-lock.json"]
# documentation: README, licence, the README's rendered page and header, the design source and the
# README renderer
docs = [
    "README.md",
    "LICENSE",
    "docs/readme.html",
    "docs/assets/**",
    "docs/design-source.html",
    "scripts/render_readme.py",
]
# measurement: benchmark, stress and smoke tools, their report renderers, the reports they write and
# the artifacts folder
bench = [
    "scripts/benchmark.py",
    "scripts/stress_test.py",
    "scripts/smoke.py",
    "scripts/render_stress_report.py",
    "scripts/render_validation.py",
    "docs/validation.html",
    "docs/stress-test.html",
    "artifacts/**",
]
# packaging and deployment: the container image, compose file, deployment template and environment
# example
deploy = ["Dockerfile", ".dockerignore", "compose.yaml", "deploy/**", ".env.example"]
# workspace-wide: Cargo manifest and lockfile, toolchain, ignore list and CI; a change here merges
# alone
shared = ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".gitignore", ".github/**"]
